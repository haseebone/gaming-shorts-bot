name: Gaming Shorts Upload

on:
  schedule:
    # Spread across the US day (Eastern Time) instead of posting everything
    # at once, so viewers in different time zones/routines each see a fresh
    # Short. Times are in UTC because GitHub cron always runs in UTC.
    #
    #   9:00 AM ET (morning/commute)   -> 13:00 UTC
    #  12:00 PM ET (lunch break)       -> 16:00 UTC
    #   3:00 PM ET (afternoon lull)    -> 19:00 UTC
    #   6:00 PM ET (after work/school) -> 22:00 UTC
    #   9:00 PM ET (evening scroll)    -> 01:00 UTC (next day)
    #
    # Note: these are pinned to Eastern *Standard* Time (UTC-5). During US
    # Daylight Saving Time (roughly March-November) actual local delivery
    # will land about an hour earlier than listed -- a small, harmless
    # drift for a free/simple setup, no action needed from you.
    - cron: "0 13 * * *"
    - cron: "0 16 * * *"
    - cron: "0 19 * * *"
    - cron: "0 22 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can save its own state file back to the repo

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and espeak-ng
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download Piper voice model (offline TTS fallback)
        working-directory: scripts
        run: |
          mkdir -p voices
          if [ ! -f voices/en_US-lessac-medium.onnx ]; then
            curl -L -o voices/en_US-lessac-medium.onnx \
              https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx
            curl -L -o voices/en_US-lessac-medium.onnx.json \
              https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json
          fi

      - name: Download background music (free, public-domain CC0 tracks)
        working-directory: scripts
        run: |
          mkdir -p music
          if [ -z "$(ls -A music 2>/dev/null)" ]; then
            # Internet Archive item "allfreepdmusicbykuronekony4n" -- a
            # verified mirror of freepd.com CC0 (public domain, no
            # attribution required) tracks, confirmed to contain these
            # exact filenames at this exact nested path (the old BASE/
            # filenames below were guessed and didn't exist -- that's
            # what caused every download to 404). curl -f so a single
            # missing/renamed track just gets skipped instead of failing
            # the whole run -- background music is a nice-to-have, not
            # required.
            BASE="https://archive.org/download/allfreepdmusicbykuronekony4n/content/drive/My%20Drive/Download/all%20freepd%20music%20%28by%20kuronekony4n%29"
            curl -f -L -o "music/epic-boss-battle.mp3" "$BASE/Epic%20Boss%20Battle.mp3" || true
            curl -f -L -o "music/epic-blockbuster-2.mp3" "$BASE/Epic%20Blockbuster%202.mp3" || true
            curl -f -L -o "music/evil-incoming.mp3" "$BASE/Evil%20Incoming.mp3" || true
            curl -f -L -o "music/strength-of-the-titans.mp3" "$BASE/Strength%20of%20the%20Titans.mp3" || true
            # Remove any zero-byte files left behind by a failed download.
            find music -type f -empty -delete
          fi

      - name: Run pipeline
        working-directory: scripts
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py

      - name: Save "already posted" state back to the repo
        # Commits scripts/state/posted_links.json if it changed, so the
        # bot remembers which stories it's used even between separate
        # runs. Using git instead of actions/cache here because cache
        # entries can't be overwritten once created in a day -- that was
        # silently failing before.
        run: |
          git config user.name "gaming-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain scripts/state)" ]; then
            git add scripts/state
            git commit -m "Update posted-stories state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
